/* ===== FLASHCARDS — 60 thẻ (3 thẻ / bài) ===== */
var CARDS = [
{ id: 'C1-1', lesson: 1, diff: 'Dễ', q: 'What is the difference between Selenium and WebDriver?', a: 'Selenium is a suite of tools for browser automation; WebDriver is the API that sends commands to the browser.', vi: 'Selenium là bộ công cụ tự động hóa trình duyệt; WebDriver là API Java gửi lệnh tới trình duyệt qua driver.', kw: ['Selenium suite', 'WebDriver API', 'driver'] },
{ id: 'C1-2', lesson: 1, diff: 'Vừa', q: 'Describe the path of a command from a Java test to the browser.', a: 'Test script → WebDriver API → browser driver (e.g. ChromeDriver) → browser; the response returns the same way.', vi: 'Test script gửi qua WebDriver API, rồi tới driver của trình duyệt, rồi tới trình duyệt. Kết quả quay về theo chiều ngược lại.', kw: ['W3C WebDriver', 'driver', 'response'] },
{ id: 'C1-3', lesson: 1, diff: 'Dễ', q: 'Why should you call driver.quit() at the end of a test?', a: 'quit() closes all windows and ends the session, so no browser process is left running.', vi: 'quit() đóng mọi cửa sổ và kết thúc session, tránh để tiến trình trình duyệt treo và tốn tài nguyên.', kw: ['quit', 'session', 'cleanup'] },
{ id: 'C2-1', lesson: 2, diff: 'Dễ', q: 'What is the difference between driver.close() and driver.quit()?', a: 'close() closes the current window; quit() closes all windows and ends the WebDriver session.', vi: 'close() chỉ đóng cửa sổ hiện tại; quit() đóng tất cả cửa sổ và kết thúc session.', kw: ['close', 'quit', 'window', 'session'] },
{ id: 'C2-2', lesson: 2, diff: 'Vừa', q: 'Do driver.get() and driver.navigate().to() differ?', a: 'Both load a URL; navigate() also provides back(), forward() and refresh().', vi: 'Cả hai đều mở URL; navigate() có thêm back, forward và refresh.', kw: ['get', 'navigate', 'back', 'forward'] },
{ id: 'C2-3', lesson: 2, diff: 'Khó', q: 'Why is Thread.sleep after navigate().back() a bad practice?', a: 'A fixed sleep guesses the timing; use an explicit wait for a specific condition instead.', vi: 'Sleep cố định là đoán thời gian, có thể quá ngắn hoặc lãng phí. Nên chờ điều kiện cụ thể.', kw: ['explicit wait', 'sleep', 'condition'] },
{ id: 'C3-1', lesson: 3, diff: 'Dễ', q: 'What is the DOM?', a: 'The Document Object Model: the tree of objects the browser builds from HTML and keeps while the page runs.', vi: 'DOM là cây đối tượng do trình duyệt dựng từ HTML, và được giữ lại trong khi trang chạy.', kw: ['DOM', 'tree', 'HTML'] },
{ id: 'C3-2', lesson: 3, diff: 'Vừa', q: 'Which locator is usually the most stable: id or class? Why?', a: 'id is usually the most stable and unique on a page; class can match many elements.', vi: 'id thường ổn định và duy nhất; class có thể khớp nhiều phần tử, nên dễ chọn nhầm.', kw: ['id unique', 'class', 'stable'] },
{ id: 'C3-3', lesson: 3, diff: 'Khó', q: 'What is a locator?', a: 'A way to describe an element so Selenium can find it, such as By.id, By.name or By.cssSelector.', vi: 'Locator là cách mô tả để tìm phần tử, ví dụ By.id, By.name hoặc By.cssSelector.', kw: ['By', 'locator', 'find'] },
{ id: 'C4-1', lesson: 4, diff: 'Dễ', q: 'What is XPath used for in Selenium?', a: 'To locate elements by their structure, attributes or text using the XPath query language.', vi: 'XPath dùng để tìm phần tử theo cấu trúc, thuộc tính hoặc text bằng ngôn ngữ truy vấn XPath.', kw: ['XPath', 'structure', 'text'] },
{ id: 'C4-2', lesson: 4, diff: 'Vừa', q: 'Absolute vs relative XPath?', a: 'Absolute starts from /html and breaks easily; relative starts with // and matches by attributes or text.', vi: 'Absolute bắt đầu từ /html, dễ vỡ; relative bắt đầu bằng //, dựa trên thuộc tính hoặc text.', kw: ['absolute', 'relative', '//'] },
{ id: 'C4-3', lesson: 4, diff: 'Khó', q: 'What does following-sibling:: do?', a: 'It selects the nodes that come after the current node under the same parent.', vi: 'following-sibling:: chọn các node đứng sau node hiện tại, cùng cha.', kw: ['following-sibling', 'axis', 'same parent'] },
{ id: 'C5-1', lesson: 5, diff: 'Dễ', q: 'What is a CSS selector used for?', a: 'To select elements with CSS syntax, such as #id, .class, tag or [attribute].', vi: 'CSS selector chọn phần tử bằng cú pháp CSS, như #id, .class, tag hoặc [attribute].', kw: ['CSS', '#id', '.class'] },
{ id: 'C5-2', lesson: 5, diff: 'Vừa', q: 'How do you match an input whose type is email?', a: 'input[type="email"] using an attribute selector.', vi: 'Dùng attribute selector: input[type="email"].', kw: ['attribute selector', '[type]'] },
{ id: 'C5-3', lesson: 5, diff: 'Khó', q: 'Why are combined selectors useful?', a: 'Multiple conditions must all match, which narrows the result to fewer, more specific elements.', vi: 'Nhiều điều kiện phải đúng cùng lúc, nên kết quả hẹp và cụ thể hơn.', kw: ['combined', 'AND', 'specific'] },
{ id: 'C6-1', lesson: 6, diff: 'Dễ', q: 'What is the difference between findElement and findElements?', a: 'findElement returns one WebElement and throws if none; findElements returns a List that may be empty.', vi: 'findElement trả về một WebElement và ném lỗi nếu không có; findElements trả về List, có thể rỗng.', kw: ['findElement', 'findElements', 'List'] },
{ id: 'C6-2', lesson: 6, diff: 'Vừa', q: 'What happens when findElements finds nothing?', a: 'It returns an empty list; it does not throw NoSuchElementException.', vi: 'Nó trả về danh sách rỗng; không ném NoSuchElementException.', kw: ['empty list', 'no exception'] },
{ id: 'C6-3', lesson: 6, diff: 'Khó', q: 'When does findElement throw NoSuchElementException?', a: 'When no matching element is found after applicable waiting (for example, the implicit wait) has finished.', vi: 'Khi không tìm thấy phần tử nào khớp sau khi đã áp dụng thời gian chờ (ví dụ implicit wait).', kw: ['NoSuchElementException', 'wait'] },
{ id: 'C7-1', lesson: 7, diff: 'Dễ', q: 'What is the difference between getText() and getAttribute()?', a: 'getText returns visible text; getAttribute returns the attribute or property value.', vi: 'getText lấy chữ hiển thị; getAttribute lấy giá trị thuộc tính hoặc property.', kw: ['getText', 'visible text', 'getAttribute'] },
{ id: 'C7-2', lesson: 7, diff: 'Vừa', q: 'isDisplayed vs isEnabled?', a: 'isDisplayed checks whether the element is shown; isEnabled checks whether it can be used.', vi: 'isDisplayed kiểm tra có hiển thị không; isEnabled kiểm tra có được phép thao tác không.', kw: ['displayed', 'enabled'] },
{ id: 'C7-3', lesson: 7, diff: 'Khó', q: 'What does getDomAttribute() read?', a: 'It returns the value of the attribute as it appears in the DOM, unlike getAttribute which may return a property value.', vi: 'Nó đọc giá trị attribute đúng như trong DOM; getAttribute có thể trả về giá trị property.', kw: ['getDomAttribute', 'DOM', 'property'] },
{ id: 'C8-1', lesson: 8, diff: 'Dễ', q: 'What is an implicit wait?', a: 'A session-wide maximum time the driver waits when trying to find an element.', vi: 'Thời gian chờ tối đa cho toàn session khi tìm phần tử.', kw: ['implicit', 'session', 'maximum'] },
{ id: 'C8-2', lesson: 8, diff: 'Vừa', q: 'Does implicit wait always wait the full timeout?', a: 'No. The driver returns as soon as the element is found; the timeout is a maximum.', vi: 'Không. Driver trả về ngay khi tìm thấy; timeout chỉ là giới hạn tối đa.', kw: ['maximum', 'returns early'] },
{ id: 'C8-3', lesson: 8, diff: 'Khó', q: 'Why is mixing implicit and explicit waits risky?', a: 'Combined they can produce unpredictable total wait times; Selenium recommends not mixing them.', vi: 'Kết hợp có thể tạo thời gian chờ khó đoán; tài liệu Selenium khuyên không trộn.', kw: ['do not mix', 'unpredictable'] },
{ id: 'C9-1', lesson: 9, diff: 'Dễ', q: 'What is an explicit wait?', a: 'A wait that pauses until a specific condition is true or the timeout expires.', vi: 'Chờ cho đến khi một điều kiện cụ thể đúng, hoặc hết thời gian.', kw: ['explicit', 'condition', 'timeout'] },
{ id: 'C9-2', lesson: 9, diff: 'Vừa', q: 'What exception is thrown when an explicit wait times out?', a: 'TimeoutException.', vi: 'TimeoutException.', kw: ['TimeoutException'] },
{ id: 'C9-3', lesson: 9, diff: 'Khó', q: 'Does elementToBeClickable guarantee that nothing covers the element?', a: 'No. It checks visibility and enabled state, but another element can still intercept the click.', vi: 'Không. Nó kiểm tra hiển thị và enabled, nhưng phần tử khác vẫn có thể chặn click.', kw: ['clickable', 'intercept'] },
{ id: 'C10-1', lesson: 10, diff: 'Dễ', q: 'What is FluentWait?', a: 'A configurable wait with a timeout, a polling interval and optional ignored exceptions.', vi: 'Bộ chờ có thể cấu hình: timeout, chu kỳ polling và exception được bỏ qua.', kw: ['FluentWait', 'polling', 'ignoring'] },
{ id: 'C10-2', lesson: 10, diff: 'Vừa', q: 'How is WebDriverWait related to FluentWait?', a: 'WebDriverWait is a specialization of FluentWait in Selenium 4.', vi: 'WebDriverWait là lớp chuyên biệt của FluentWait trong Selenium 4.', kw: ['WebDriverWait', 'extends FluentWait'] },
{ id: 'C10-3', lesson: 10, diff: 'Khó', q: 'What does pollingEvery() control?', a: 'How often the condition is checked during the wait.', vi: 'Tần suất kiểm tra điều kiện trong lúc chờ.', kw: ['pollingEvery', 'interval'] },
{ id: 'C11-1', lesson: 11, diff: 'Dễ', q: 'Which elements is the Select class intended for?', a: 'Native HTML select elements.', vi: 'Các thẻ select HTML gốc.', kw: ['Select', 'native', 'select tag'] },
{ id: 'C11-2', lesson: 11, diff: 'Vừa', q: 'How do you check whether a checkbox is checked?', a: 'Use isSelected() on the checkbox element.', vi: 'Dùng isSelected() trên phần tử checkbox.', kw: ['isSelected'] },
{ id: 'C11-3', lesson: 11, diff: 'Khó', q: 'How do you handle a custom dropdown built with div and li?', a: 'Click to open it, then click the option element; Select does not work on it.', vi: 'Click để mở, rồi click option; Select không dùng được cho loại này.', kw: ['custom dropdown', 'click', 'not Select'] },
{ id: 'C12-1', lesson: 12, diff: 'Dễ', q: 'How do you accept a JavaScript alert?', a: 'driver.switchTo().alert().accept().', vi: 'driver.switchTo().alert().accept().', kw: ['switchTo', 'alert', 'accept'] },
{ id: 'C12-2', lesson: 12, diff: 'Vừa', q: 'Difference between accept() and dismiss()?', a: 'accept() clicks OK; dismiss() clicks Cancel.', vi: 'accept() bấm OK; dismiss() bấm Cancel.', kw: ['accept', 'dismiss', 'OK', 'Cancel'] },
{ id: 'C12-3', lesson: 12, diff: 'Khó', q: 'What exception is thrown if no alert is present?', a: 'NoAlertPresentException.', vi: 'NoAlertPresentException.', kw: ['NoAlertPresentException'] },
{ id: 'C13-1', lesson: 13, diff: 'Dễ', q: 'Why must you switch into an iframe before finding its elements?', a: 'Each iframe is a separate browsing context; the driver only sees the DOM of the current context.', vi: 'Mỗi iframe là một ngữ cảnh riêng; driver chỉ thấy DOM của ngữ cảnh hiện tại.', kw: ['iframe', 'context', 'switchTo'] },
{ id: 'C13-2', lesson: 13, diff: 'Vừa', q: 'How do you return to the main document?', a: 'driver.switchTo().defaultContent().', vi: 'driver.switchTo().defaultContent().', kw: ['defaultContent'] },
{ id: 'C13-3', lesson: 13, diff: 'Khó', q: 'What does parentFrame() do?', a: 'It moves the driver context up one level in the frame hierarchy.', vi: 'Đưa ngữ cảnh driver lên một cấp trong cây frame.', kw: ['parentFrame', 'one level'] },
{ id: 'C14-1', lesson: 14, diff: 'Dễ', q: 'What is a window handle?', a: 'A unique identifier of a browser window or tab.', vi: 'Mã định danh duy nhất của một cửa sổ hoặc tab trình duyệt.', kw: ['window handle', 'unique'] },
{ id: 'C14-2', lesson: 14, diff: 'Vừa', q: 'Can you assume the first handle in getWindowHandles() is the original tab?', a: 'No. The set has no guaranteed order; compare with the saved original handle.', vi: 'Không. Tập handle không có thứ tự đảm bảo; hãy so với handle đã lưu.', kw: ['no guaranteed order', 'compare'] },
{ id: 'C14-3', lesson: 14, diff: 'Khó', q: 'What must you do after closing a tab you switched to?', a: 'Switch back to a window that is still open using switchTo().window(handle).', vi: 'Chuyển về một cửa sổ còn mở bằng switchTo().window(handle).', kw: ['switchTo', 'window handle', 'still open'] },
{ id: 'C15-1', lesson: 15, diff: 'Dễ', q: 'What is the Actions class used for?', a: 'Building sequences of mouse and keyboard actions such as hover, drag-and-drop and key combinations.', vi: 'Xây chuỗi thao tác chuột và phím như hover, kéo thả, tổ hợp phím.', kw: ['Actions', 'mouse', 'keyboard'] },
{ id: 'C15-2', lesson: 15, diff: 'Vừa', q: 'Why must you call perform() on an Actions chain?', a: 'Without perform(), the built chain is not executed.', vi: 'Nếu không gọi perform(), chuỗi thao tác không được thực thi.', kw: ['perform', 'build'] },
{ id: 'C15-3', lesson: 15, diff: 'Khó', q: 'How do you perform Ctrl+A?', a: 'keyDown(Keys.CONTROL).sendKeys("a").keyUp(Keys.CONTROL).perform().', vi: 'keyDown(Keys.CONTROL).sendKeys("a").keyUp(Keys.CONTROL).perform().', kw: ['keyDown', 'keyUp', 'Keys.CONTROL'] },
{ id: 'C16-1', lesson: 16, diff: 'Dễ', q: 'What causes NoSuchElementException?', a: 'The locator matches no element, often because of a typo or a wrong context.', vi: 'Locator không khớp phần tử nào, thường do gõ sai hoặc sai ngữ cảnh.', kw: ['locator', 'typo', 'context'] },
{ id: 'C16-2', lesson: 16, diff: 'Vừa', q: 'What is StaleElementReferenceException?', a: 'The element reference points to an element that is no longer attached to the current DOM, usually after re-rendering.', vi: 'Tham chiếu trỏ tới phần tử không còn gắn với DOM hiện tại, thường sau khi trang render lại.', kw: ['stale', 'reference', 'DOM'] },
{ id: 'C16-3', lesson: 16, diff: 'Khó', q: 'What does ElementClickInterceptedException mean?', a: 'Another element is covering the target at the click point, so the click would hit that element instead.', vi: 'Có phần tử khác che tại điểm click, nên click sẽ rơi vào phần tử đó.', kw: ['intercepted', 'overlay', 'click point'] },
{ id: 'C17-1', lesson: 17, diff: 'Dễ', q: 'What is TestNG?', a: 'A Java testing framework that runs test methods and manages their lifecycle with annotations.', vi: 'Framework kiểm thử Java chạy test và quản lý vòng đời bằng annotation.', kw: ['TestNG', 'annotation', 'lifecycle'] },
{ id: 'C17-2', lesson: 17, diff: 'Vừa', q: 'What is the difference between @BeforeClass and @BeforeMethod?', a: 'BeforeClass runs once per class; BeforeMethod runs before every test method.', vi: 'BeforeClass chạy một lần cho class; BeforeMethod chạy trước mỗi test.', kw: ['BeforeClass', 'BeforeMethod', 'once', 'every test'] },
{ id: 'C17-3', lesson: 17, diff: 'Khó', q: 'What is the difference between @BeforeTest and @BeforeMethod?', a: 'BeforeTest runs once for a <test> tag in testng.xml; BeforeMethod runs before each @Test method.', vi: 'BeforeTest chạy một lần cho thẻ <test> trong testng.xml; BeforeMethod chạy trước mỗi @Test.', kw: ['BeforeTest', '<test>', 'testng.xml'] },
{ id: 'C18-1', lesson: 18, diff: 'Dễ', q: 'What is the parameter order for TestNG assertEquals?', a: 'assertEquals(actual, expected).', vi: 'assertEquals(actual, expected).', kw: ['actual', 'expected'] },
{ id: 'C18-2', lesson: 18, diff: 'Vừa', q: 'What is the difference between hard assert and soft assert?', a: 'A hard assert stops the test at the first failure; a soft assert records failures and continues.', vi: 'Hard assert dừng ngay khi sai; soft assert ghi lại lỗi và tiếp tục.', kw: ['hard', 'soft', 'stop', 'continue'] },
{ id: 'C18-3', lesson: 18, diff: 'Khó', q: 'What happens if you forget assertAll() with SoftAssert?', a: 'The collected failures are never reported, so the test may pass incorrectly.', vi: 'Các lỗi đã gom không được báo cáo, test có thể pass sai.', kw: ['assertAll', 'never reported', 'false pass'] },
{ id: 'C19-1', lesson: 19, diff: 'Dễ', q: 'What is the Page Object Model?', a: 'A design pattern where each page has a class holding its locators and actions.', vi: 'Mẫu thiết kế: mỗi trang có một class chứa locator và hành động của trang.', kw: ['design pattern', 'page class', 'locators'] },
{ id: 'C19-2', lesson: 19, diff: 'Vừa', q: 'Is POM a testing framework?', a: 'No. POM is a design pattern; TestNG or JUnit are testing frameworks.', vi: 'Không. POM là mẫu thiết kế; TestNG hay JUnit mới là framework kiểm thử.', kw: ['design pattern', 'not a framework'] },
{ id: 'C19-3', lesson: 19, diff: 'Khó', q: 'What is PageFactory?', a: 'A Selenium support helper that initializes Page Object fields annotated with @FindBy.', vi: 'Tiện ích hỗ trợ của Selenium khởi tạo các trường Page Object có @FindBy.', kw: ['PageFactory', '@FindBy', 'initElements'] },
{ id: 'C20-1', lesson: 20, diff: 'Dễ', q: 'What is data-driven testing?', a: 'Running the same test logic with several sets of input data.', vi: 'Chạy cùng logic test với nhiều bộ dữ liệu đầu vào.', kw: ['data-driven', 'input data'] },
{ id: 'C20-2', lesson: 20, diff: 'Vừa', q: 'What annotation supplies data to a test in TestNG?', a: '@DataProvider, and the test uses @Test(dataProvider = "name").', vi: '@DataProvider; test dùng @Test(dataProvider = "tên").', kw: ['@DataProvider', 'dataProvider'] },
{ id: 'C20-3', lesson: 20, diff: 'Khó', q: 'Why include negative data in a DataProvider?', a: 'To verify the application rejects invalid input correctly, not only that valid input works.', vi: 'Để kiểm tra ứng dụng từ chối dữ liệu sai đúng cách, không chỉ kiểm tra dữ liệu đúng.', kw: ['positive', 'negative', 'reject'] }
];

var QUIZ = [{"id":"Q1-1","lesson":1,"q":"Bạn thấy \"ChromeDriver\" trong code. Vai trò đúng của nó là gì?","opts":["Là trình trung gian nhận lệnh WebDriver và điều khiển Chrome","Là thư viện kiểm thử thay thế TestNG","Là giao diện người dùng của Chrome","Là file báo cáo sau khi test chạy"],"ans":0,"exp":"ChromeDriver là chương trình trung gian: nhận lệnh WebDriver và thực hiện trên Chrome.","why":["Đúng: đây là vai trò của driver.","TestNG là framework chạy test, không phải driver.","Không phải giao diện người dùng; Chrome là ứng dụng riêng.","Báo cáo do framework tạo, không phải driver."],"ref":"WebDriver overview"},
{"id":"Q1-2","lesson":1,"q":"Test gọi driver.findElement(...) và nhận lỗi. Lỗi đó có nghĩa gì về luồng lệnh?","opts":["Java không biên dịch được","Lệnh đã được gửi và trình duyệt/driver trả về lỗi","Selenium không cài đặt","Trình duyệt tự đóng"],"ans":1,"exp":"Lệnh đi qua các tầng và phản hồi lỗi quay về Java; đây là ngoại lệ từ driver/trình duyệt.","why":["Lỗi biên dịch xảy ra trước khi chạy, không phải lỗi runtime này.","Đúng: lỗi là phản hồi của luồng lệnh.","Nếu Selenium không cài, lỗi sẽ khác (ClassNotFound/compile).","Trình duyệt đóng là một tình huống khác, không phải mặc định của lệnh này."],"ref":"W3C WebDriver"},
{"id":"Q1-3","lesson":1,"q":"Test kết thúc nhưng không gọi quit(). Hậu quả hợp lý nhất là gì?","opts":["Driver tự xóa mọi file","Test luôn fail","Session vẫn treo, tiến trình trình duyệt tiếp tục chạy","Trình duyệt được đóng ngay lập tức"],"ans":2,"exp":"Phiên không tự đóng; cần quit() để giải phóng tài nguyên.","why":["Driver không xóa file của bạn.","Test có thể vẫn pass; việc không đóng không đồng nghĩa fail.","Đúng: session và tiến trình còn sống.","Trình duyệt không tự đóng nếu không có lệnh đóng."],"ref":"WebDriver session"},
{"id":"Q2-1","lesson":2,"q":"Sau khi click link mở tab mới, bạn gọi driver.close(). Điều gì xảy ra với session?","opts":["Session kết thúc hoàn toàn","Tất cả tab đóng","Driver tự chuyển về tab gốc","Chỉ tab hiện tại đóng; session còn sống nhưng driver vẫn trỏ tới tab đã đóng"],"ans":3,"exp":"close() đóng cửa sổ hiện tại; session vẫn sống. Cần switchTo() để điều khiển cửa sổ còn mở.","why":["Đó là quit(), không phải close().","Chỉ cửa sổ hiện tại bị đóng.","Driver không tự chuyển; phải switchTo().window().","Đúng."],"ref":"close() / quit()"},
{"id":"Q2-2","lesson":2,"q":"Bạn cần mở trang rồi quay lại trang trước trong cùng test. Lệnh phù hợp nhất là:","opts":["driver.navigate().back()","driver.get(\"back\")","driver.back()","driver.close()"],"ans":0,"exp":"Back/forward nằm trong đối tượng navigate().","why":["Đúng: navigate().back() quay lại trang trước.","\"back\" không phải URL hợp lệ.","Không có phương thức back() trực tiếp trên driver.","close() đóng cửa sổ, không quay lại."],"ref":"WebDriver.Navigation"},
{"id":"Q2-3","lesson":2,"q":"Sự khác biệt giữa get(url) và navigate().to(url) là gì?","opts":["get không tải được trang","Cả hai đều mở URL; navigate() còn cung cấp back, forward và refresh","navigate().to() không hỗ trợ URL","navigate() chỉ dùng cho iframe"],"ans":1,"exp":"Cả hai đều điều hướng tới URL; navigate() mở rộng thêm các thao tác lịch sử.","why":["get tải được trang; đó là lệnh chính để mở URL.","Đúng.","navigate().to() có hỗ trợ URL.","Không liên quan iframe."],"ref":"WebDriver.Navigation"},
{"id":"Q3-1","lesson":3,"q":"Trang có ba nút cùng class \"btn\". Bạn dùng findElement(By.className(\"btn\")). Điều gì xảy ra?","opts":["Ném TooManyElementsException","Trả về danh sách 3 nút","Trả về phần tử đầu tiên khớp trong DOM","Trả về nút cuối cùng"],"ans":2,"exp":"findElement lấy phần tử khớp đầu tiên; nên locator dễ chọn nhầm.","why":["Không có ngoại lệ như vậy trong findElement.","Đó là findElements.","Đúng.","Không đảm bảo lấy cuối; mặc định là khớp đầu tiên."],"ref":"Locating elements"},
{"id":"Q3-2","lesson":3,"q":"Id của ô nhập đổi mỗi lần tải trang (ví dụ \"input_8f2a\" rồi \"input_b19c\"). Hướng sửa tốt nhất?","opts":["Dùng Thread.sleep để chờ id ổn định","Dùng chỉ số thứ tự trong danh sách","Tăng implicit wait lên 60 giây","Dùng thuộc tính ổn định như name hoặc data-testid"],"ans":3,"exp":"Chọn thuộc tính ổn định; tăng wait không sửa được locator sai.","why":["Sleep không làm id ổn định.","Chỉ số dễ vỡ khi thứ tự thay đổi.","Wait không giải quyết id đã đổi.","Đúng: thuộc tính có nghĩa và ít đổi hơn."],"ref":"Locating elements"},

{"id":"Q11-2","lesson":11,"q":"Dropdown \"Quốc gia\" là div/li tự vẽ, không phải select. Select(element) có dùng được không?","opts":["Có, luôn luôn","Có, nếu dùng By.xpath","Có, nếu gọi selectByIndex","Không, Select dành cho thẻ select native"],"ans":3,"exp":"Select chỉ hỗ trợ thẻ select; với dropdown tùy biến phải click mở và click option.","why":["Không đúng với dropdown tự vẽ.","Locator không thay đổi điều kiện này.","Chỉ số không đổi bản chất.","Đúng."],"ref":"Select (Javadoc)"},
{"id":"Q11-3","lesson":11,"q":"Nhóm radio \"Giới tính\" có cùng name. Chọn \"Nữ\" khi \"Nam\" đang chọn thì:","opts":["Nam tự bỏ chọn","Cả hai được chọn","Ném lỗi","Nữ không chọn được"],"ans":0,"exp":"Radio cùng name là một nhóm đơn lựa chọn.","why":["Đúng.","Radio cùng nhóm chỉ chọn một.","Không có lỗi trong tình huống bình thường.","Nữ chọn được."],"ref":"HTML input radio"},
{"id":"Q12-1","lesson":12,"q":"Alert đang mở. Bạn muốn bấm Cancel. Lệnh đúng là:","opts":["alert.accept()","alert.dismiss()","alert.close()","alert.ok()"],"ans":1,"exp":"dismiss() là bấm Cancel/Hủy.","why":["accept bấm OK.","Đúng.","Không có close() trên Alert trong trường hợp này.","Không có ok()."],"ref":"Alerts"},
{"id":"Q12-2","lesson":12,"q":"Bạn gọi switchTo().alert() khi không có alert nào. Lỗi gì xảy ra?","opts":["NoSuchElementException","TimeoutException","NoAlertPresentException","StaleElementReferenceException"],"ans":2,"exp":"Khi không có alert, Selenium ném NoAlertPresentException.","why":["Không đúng cho alert.","Đó là lỗi chờ.","Đúng.","Liên quan element đã cũ."],"ref":"NoAlertPresentException (Javadoc)"},
{"id":"Q12-3","lesson":12,"q":"Prompt yêu cầu nhập tên. Bạn cần gửi \"Minh\" và xác nhận. Đúng thứ tự là:","opts":["accept() rồi sendKeys(\"Minh\")","dismiss() rồi sendKeys","getText() rồi accept()","sendKeys(\"Minh\") rồi accept()"],"ans":3,"exp":"Phải nhập trước, sau đó accept để gửi giá trị.","why":["Accept trước sẽ đóng prompt trước khi nhập.","Dismiss hủy, không gửi tên.","getText không gửi dữ liệu.","Đúng."],"ref":"Alerts"},
{"id":"Q13-1","lesson":13,"q":"Ô số thẻ nằm trong iframe. Vì sao findElement ở main document không thấy?","opts":["Vì mỗi iframe là một ngữ cảnh; driver chỉ thấy DOM của ngữ cảnh đang chọn","Vì iframe ẩn ô đó bằng bảo mật","Vì Selenium không hỗ trợ iframe","Vì ô phải có class"],"ans":0,"exp":"Ngữ cảnh frame riêng biệt; cần switchTo().frame().","why":["Đúng.","Không phải lý do bảo mật.","Selenium có hỗ trợ.","Class không quyết định việc này."],"ref":"Frames and iframes"},
{"id":"Q13-2","lesson":13,"q":"Đang trong iframe, cần bấm nút ở trang chính. Lệnh nào đưa về main?","opts":["driver.switchTo().parentFrame() luôn về main","driver.switchTo().defaultContent()","driver.navigate().back()","driver.close()"],"ans":1,"exp":"defaultContent() đưa về main document.","why":["parentFrame chỉ lên một cấp.","Đúng.","Back đổi trang, không đổi frame.","close đóng cửa sổ."],"ref":"Frames and iframes"},
{"id":"Q13-3","lesson":13,"q":"Frame \"inner\" nằm trong frame \"outer\". Đường đi đúng là:","opts":["switchTo().frame(\"inner\") ngay từ main","switchTo().frame(\"inner\").frame(\"outer\")","switchTo().frame(\"outer\") rồi switchTo().frame(\"inner\")","Không thể vào inner"],"ans":2,"exp":"Frame lồng nhau phải đi từng cấp từ ngoài vào trong.","why":["Không tìm thấy inner từ main nếu nó nằm trong outer.","Không có chuỗi gọi như vậy.","Đúng.","Có thể vào, nhưng phải đi đúng thứ tự."],"ref":"Frames and iframes"},
{"id":"Q14-1","lesson":14,"q":"Lấy danh sách tất cả cửa sổ đang mở để tìm tab mới. Phương thức đúng là:","opts":["getWindowHandle()","getTitle()","getCurrentUrl()","getWindowHandles()"],"ans":3,"exp":"getWindowHandles() trả về tập handle.","why":["Chỉ trả về handle hiện tại.","Trả về tiêu đề trang.","Trả về URL.","Đúng."],"ref":"Windows and tabs"},
{"id":"Q14-2","lesson":14,"q":"Có nên giả định handle thứ hai trong getWindowHandles() luôn là tab mới không?","opts":["Không, tập handle không có thứ tự đảm bảo; so với handle đã lưu","Có, luôn luôn","Có, nếu dùng Chrome","Có, nếu gọi getWindowHandle trước"],"ans":0,"exp":"Không giả định thứ tự; so sánh với handle gốc.","why":["Đúng.","Không đảm bảo thứ tự.","Không phụ thuộc trình duyệt cụ thể.","Không liên quan."],"ref":"Windows and tabs"},
{"id":"Q14-3","lesson":14,"q":"Bạn vừa đóng tab mới bằng close(). Bước tiếp theo đúng là:","opts":["Tiếp tục thao tác ngay","switchTo().window(handle gốc)","quit() rồi tạo driver mới","Thread.sleep"],"ans":1,"exp":"Sau khi đóng, phải chuyển về cửa sổ còn mở.","why":["Cửa sổ hiện tại đã đóng.","Đúng.","Quá mức cần thiết, mất session.","Sleep không khắc phục."],"ref":"Windows and tabs"},
{"id":"Q15-1","lesson":15,"q":"Bạn cần hover để mở submenu. Dùng Actions như thế nào?","opts":["driver.hover()","menu.click() rồi quit()","new Actions(driver).moveToElement(menu).perform()","menu.sendKeys(Keys.HOVER)"],"ans":2,"exp":"moveToElement đưa chuột tới phần tử; perform thực thi.","why":["Không có phương thức hover() trên driver.","Click khác với hover.","Đúng.","Không có phím hover."],"ref":"Actions API"},
{"id":"Q15-2","lesson":15,"q":"Bạn đã gọi Actions.moveToElement(x) nhưng không gọi perform(). Điều gì xảy ra?","opts":["Hành động được thực thi tự động","Ném lỗi biên dịch","Trình duyệt đóng","Chuỗi không chạy vì chưa perform()"],"ans":3,"exp":"Cần perform() để thực thi chuỗi đã xây.","why":["Không tự động.","Đây là lỗi logic, không phải lỗi biên dịch.","Không liên quan.","Đúng."],"ref":"Actions API"},
{"id":"Q15-3","lesson":15,"q":"Để chọn toàn bộ văn bản trong ô (Ctrl+A), đoạn nào đúng?","opts":["keyDown(Keys.CONTROL).sendKeys(\"a\").keyUp(Keys.CONTROL).perform()","sendKeys(\"ctrl+a\")","selectAll()","click(Keys.CONTROL)"],"ans":0,"exp":"Giữ phím bổ trợ bằng keyDown, gõ phím thường, nhả bằng keyUp.","why":["Đúng.","Không gửi tổ hợp đúng cách.","Không có phương thức selectAll trên WebElement.","click không nhận tổ hợp phím kiểu này."],"ref":"Keyboard"},
{"id":"Q16-1","lesson":16,"q":"Bạn lưu WebElement, sau đó trang render lại và gọi getText() trên tham chiếu cũ. Lỗi đúng là:","opts":["NoSuchElementException","StaleElementReferenceException","ElementClickInterceptedException","TimeoutException"],"ans":1,"exp":"Tham chiếu đã cũ vì phần tử bị thay trong DOM.","why":["Đó là khi không tìm thấy phần tử.","Đúng.","Đó là khi bị phần tử khác che khi click.","Đó là khi hết thời gian chờ."],"ref":"Troubleshooting errors"},
{"id":"Q16-2","lesson":16,"q":"Click bị chặn bởi overlay. Cách xử lý đúng nhất là:","opts":["Thêm sleep dài hơn","Bỏ qua lỗi trong try/catch","Chờ overlay biến mất hoặc đóng nó, rồi click lại","Dùng JavaScript click luôn mà không suy nghĩ"],"ans":2,"exp":"Nên xử lý nguyên nhân (chờ/đóng overlay); JavaScript click có thể che giấu lỗi người dùng thật.","why":["Sleep không xử lý nguyên nhân.","Bắt lỗi rồi bỏ qua làm test vô nghĩa.","Đúng.","JavaScript click không tương đương hành vi người dùng."],"ref":"Troubleshooting errors"},
{"id":"Q16-3","lesson":16,"q":"Nhầm lẫn phổ biến nào là sai?","opts":["Timeout là hết thời gian chờ điều kiện","NoSuchElement là không tìm thấy phần tử sau khi áp dụng wait","Stale nghĩa là tham chiếu cũ","Intercepted nghĩa là phần tử đã bị xóa khỏi DOM"],"ans":3,"exp":"Intercepted nghĩa là có phần tử khác che tại điểm click; phần tử bị xóa khỏi DOM là Stale.","why":["Đúng định nghĩa.","Đúng định nghĩa.","Đúng định nghĩa.","Đây là câu SAI: đó là mô tả Stale, không phải Intercepted."],"ref":"Troubleshooting errors"},
{"id":"Q17-1","lesson":17,"q":"Annotation nào chạy một lần trước mọi test trong class?","opts":["@BeforeClass","@BeforeMethod","@Test","@AfterMethod"],"ans":0,"exp":"@BeforeClass chạy một lần trước các test của class.","why":["Đúng.","Chạy trước mỗi test.","Đánh dấu test.","Chạy sau mỗi test."],"ref":"TestNG — Annotations"},
{"id":"Q17-2","lesson":17,"q":"Test fail giữa chừng. Có chắc @AfterMethod vẫn chạy không?","opts":["Không bao giờ","Có, AfterMethod vẫn được gọi sau test, kể cả khi fail","Chỉ khi test pass","Chỉ khi dùng SoftAssert"],"ans":1,"exp":"AfterMethod thường chạy sau test dù kết quả là gì, phù hợp để chụp ảnh và dọn dẹp.","why":["Sai: thường vẫn chạy.","Đúng.","Sai.","Không liên quan SoftAssert."],"ref":"TestNG — Annotations"},
{"id":"Q17-3","lesson":17,"q":"Khác nhau giữa @BeforeTest và @BeforeMethod?","opts":["Không khác gì","BeforeTest chạy trước mỗi @Test; BeforeMethod chạy một lần","BeforeTest chạy một lần cho thẻ <test>; BeforeMethod chạy trước mỗi @Test","BeforeTest chỉ dùng cho alert"],"ans":2,"exp":"Phạm vi khác nhau trong vòng đời TestNG.","why":["Khác phạm vi.","Ngược lại.","Đúng.","Không liên quan alert."],"ref":"TestNG — testng.xml"},
{"id":"Q18-1","lesson":18,"q":"Trong TestNG, Assert.assertEquals nhận tham số theo thứ tự nào?","opts":["(expected, actual)","(message, actual, expected)","(actual, message)","(actual, expected)"],"ans":3,"exp":"TestNG: assertEquals(actual, expected).","why":["Ngược lại với TestNG.","Message thường là tham số cuối.","Thiếu expected.","Đúng."],"ref":"TestNG — Asserts"},
{"id":"Q18-2","lesson":18,"q":"Bạn muốn kiểm tra 3 điều độc lập và thấy đủ lỗi trong một lần chạy. Nên dùng:","opts":["SoftAssert và gọi assertAll() ở cuối","Hard assert ba lần","Không assert gì","Chỉ assertTrue"],"ans":0,"exp":"SoftAssert gom lỗi; assertAll() báo tổng hợp.","why":["Đúng.","Dừng ở lỗi đầu tiên.","Không kiểm thử gì.","Vẫn dừng nếu dùng hard."],"ref":"TestNG — Asserts"},
{"id":"Q18-3","lesson":18,"q":"Dùng SoftAssert nhưng quên gọi assertAll(). Hậu quả?","opts":["Test luôn fail","Các lỗi đã gom không được báo cáo, test có thể pass sai","Ném NoSuchElementException","Không ảnh hưởng gì"],"ans":1,"exp":"SoftAssert chỉ báo lỗi khi gọi assertAll().","why":["Không tự fail.","Đúng.","Không liên quan.","Có ảnh hưởng: lỗi bị bỏ qua."],"ref":"TestNG — Asserts"},
{"id":"Q19-1","lesson":19,"q":"POM là gì?","opts":["Một framework kiểm thử","Một trình duyệt","Một mẫu thiết kế: mỗi trang có class chứa locator và hành động","Một annotation"],"ans":2,"exp":"POM là mẫu thiết kế, không phải framework.","why":["Không phải framework.","Không phải trình duyệt.","Đúng.","Không phải annotation."],"ref":"Page Object Models"},
{"id":"Q19-2","lesson":19,"q":"Locator của ô username đổi. Với POM tốt, bạn sửa ở đâu?","opts":["Trong từng test","Trong file báo cáo","Trong trình duyệt","Trong Page Object của trang login"],"ans":3,"exp":"Locator nằm ở Page Object, nên sửa một chỗ.","why":["Làm tốn công và dễ sót.","Báo cáo không chứa locator.","Không sửa được ở trình duyệt.","Đúng."],"ref":"Page Object Models"},
{"id":"Q19-3","lesson":19,"q":"PageFactory khác POM ở điểm nào?","opts":["PageFactory là tiện ích Selenium khởi tạo @FindBy; POM là ý tưởng tổ chức code","PageFactory là mẫu thiết kế, POM là thư viện","Chúng hoàn toàn giống nhau","PageFactory chỉ dùng cho alert"],"ans":0,"exp":"POM là mẫu tổ chức; PageFactory là công cụ hỗ trợ trong Selenium.","why":["Đúng.","Ngược lại.","Không giống nhau.","Không liên quan alert."],"ref":"PageFactory (Javadoc)"},
{"id":"Q20-1","lesson":20,"q":"DataProvider dùng để làm gì?","opts":["Tạo báo cáo HTML","Cung cấp nhiều bộ dữ liệu cho một test","Mở trình duyệt","Quản lý phiên bản Maven"],"ans":1,"exp":"DataProvider cung cấp dữ liệu; test chạy một lần cho mỗi hàng.","why":["Không phải báo cáo.","Đúng.","Không liên quan trình duyệt.","Không liên quan Maven."],"ref":"TestNG — DataProviders"},
{"id":"Q20-2","lesson":20,"q":"Có 3 hàng dữ liệu trong DataProvider và một @Test. Test sẽ chạy bao nhiêu lần?","opts":["1","6","3","Tùy trình duyệt"],"ans":2,"exp":"Mỗi hàng là một lần chạy độc lập.","why":["Chạy một lần chỉ khi có một hàng.","Không nhân đôi.","Đúng.","Không phụ thuộc trình duyệt."],"ref":"TestNG — DataProviders"},
{"id":"Q20-3","lesson":20,"q":"Vì sao nên có dữ liệu tiêu cực (sai) trong DataProvider?","opts":["Để test chạy nhanh hơn","Vì TestNG bắt buộc","Để bỏ qua dữ liệu đúng","Để kiểm tra ứng dụng từ chối dữ liệu sai đúng cách"],"ans":3,"exp":"Dữ liệu sai kiểm tra nhánh từ chối, không chỉ nhánh thành công.","why":["Không làm nhanh hơn.","Không bắt buộc.","Không bỏ qua dữ liệu đúng.","Đúng."],"ref":"TestNG — DataProviders"}];

/* ===== MOCK AUDIT — 30 câu hỏi mở ===== */
var AUDIT = [
{ id: 'A1', lesson: 1, cat: 'Định nghĩa', en: 'What is Selenium WebDriver?', vi: 'Selenium WebDriver là gì?', model: 'WebDriver is an API that lets my test code send commands to a browser through a browser-specific driver.', viExp: 'Hãy nhấn mạnh: WebDriver là API; driver là trung gian; trình duyệt thực hiện lệnh.', kw: ['API', 'browser', 'driver', 'commands'], follow: 'What happens between your Java code and the browser when you call findElement?', mistake: 'Nói WebDriver là một trình duyệt hoặc là công cụ tự test giao diện.' },
{ id: 'A2', lesson: 2, cat: 'So sánh', en: 'What is the difference between close() and quit()?', vi: 'Khác nhau giữa close() và quit() là gì?', model: 'close() closes the current window, while quit() closes all windows and ends the WebDriver session.', viExp: 'close chỉ đóng một cửa sổ; quit kết thúc session và giải phóng tài nguyên.', kw: ['current window', 'all windows', 'session'], follow: 'After close() on a new tab, what must you do before you continue?', mistake: 'Nói close() kết thúc toàn bộ session.' },
{ id: 'A3', lesson: 3, cat: 'Ứng dụng', en: 'Which locator would you prefer for a login button and why?', vi: 'Bạn chọn locator nào cho nút Login và vì sao?', model: 'I prefer a unique and stable id, or a stable attribute like data-testid, because it is less likely to change than text or position.', viExp: 'Ưu tiên thuộc tính duy nhất, ổn định; tránh vị trí hoặc class chung.', kw: ['unique', 'stable', 'id', 'data-testid'], follow: 'What if the id is generated randomly on each page load?', mistake: 'Chọn locator theo vị trí (nth-child) vì "chạy được ngay".' },
{ id: 'A4', lesson: 4, cat: 'So sánh', en: 'What is the difference between absolute and relative XPath?', vi: 'Khác nhau giữa absolute và relative XPath là gì?', model: 'Absolute XPath starts at the root from /html and is fragile. Relative XPath starts with // and uses attributes or text, so it is more stable.', viExp: 'Absolute dễ vỡ khi cấu trúc đổi; relative dựa trên đặc điểm ổn định.', kw: ['absolute', 'relative', '/html', '//', 'fragile'], follow: 'How would you write an XPath for a button with the text "Save"?', mistake: 'Nghĩ absolute XPath là tốt hơn vì "chính xác từng đường đi".' },
{ id: 'A5', lesson: 5, cat: 'Định nghĩa', en: 'What is a CSS selector and when do you use it?', vi: 'CSS selector là gì và khi nào dùng?', model: 'A CSS selector is a pattern to select elements by id, class, tag or attributes. I use it for short, readable locators.', viExp: 'CSS ngắn và dễ đọc; thường dùng cho id, class, attribute.', kw: ['id', 'class', 'attribute', 'short'], follow: 'Can CSS select the parent of an element? How would you handle that?', mistake: 'Nói CSS có thể tìm theo text như XPath (không chuẩn trong CSS thuần).' },
{ id: 'A6', lesson: 6, cat: 'So sánh', en: 'What is the difference between findElement and findElements?', vi: 'Khác nhau giữa findElement và findElements là gì?', model: 'findElement returns one WebElement and throws NoSuchElementException if none is found. findElements returns a list, which is empty if nothing matches.', viExp: 'Một phần tử và ném lỗi; danh sách và có thể rỗng.', kw: ['one element', 'NoSuchElementException', 'list', 'empty'], follow: 'How would you check that a banner does not exist without an exception?', mistake: 'Nói findElements ném lỗi khi không có phần tử.' },
{ id: 'A7', lesson: 7, cat: 'So sánh', en: 'What is the difference between getText and getAttribute?', vi: 'Khác nhau giữa getText và getAttribute là gì?', model: 'getText returns the visible text of an element. getAttribute returns the value of an attribute or property, such as href or value.', viExp: 'Chữ hiển thị so với giá trị thuộc tính/property.', kw: ['visible text', 'attribute', 'property', 'href', 'value'], follow: 'How do you read the value of an input field?', mistake: 'Dùng getText để đọc giá trị ô input.' },
{ id: 'A8', lesson: 8, cat: 'Định nghĩa', en: 'What is an implicit wait and does it always wait the full timeout?', vi: 'Implicit wait là gì và nó có luôn chờ đủ timeout không?', model: 'Implicit wait sets a maximum time for finding elements. It does not always wait the full time; the driver returns as soon as the element is found.', viExp: 'Timeout là giới hạn tối đa, không phải thời gian bắt buộc.', kw: ['maximum', 'finding elements', 'returns early'], follow: 'Why should you avoid mixing implicit and explicit waits?', mistake: 'Nghĩ implicit wait luôn chờ đủ 10 giây.' },
{ id: 'A9', lesson: 9, cat: 'Định nghĩa', en: 'What is an explicit wait?', vi: 'Explicit wait là gì?', model: 'An explicit wait pauses until a specific condition is met, or until the timeout expires, which then throws TimeoutException.', viExp: 'Chờ theo điều kiện cụ thể, không chờ theo thời gian cố định.', kw: ['specific condition', 'timeout', 'TimeoutException'], follow: 'Which expected condition would you use before clicking a button?', mistake: 'Dùng Thread.sleep thay cho explicit wait.' },
{ id: 'A10', lesson: 10, cat: 'Định nghĩa', en: 'What is FluentWait and how does it relate to WebDriverWait?', vi: 'FluentWait là gì và quan hệ với WebDriverWait ra sao?', model: 'FluentWait lets me configure timeout, polling interval and ignored exceptions. WebDriverWait is a specialization of FluentWait in Selenium 4.', viExp: 'FluentWait có cấu hình; WebDriverWait là lớp chuyên biệt.', kw: ['timeout', 'polling', 'ignoring', 'specialization'], follow: 'When would you ignore NoSuchElementException in a wait?', mistake: 'Nói hai thứ hoàn toàn khác nhau.' },
{ id: 'A11', lesson: 11, cat: 'Ứng dụng', en: 'How would you select an option from a native dropdown?', vi: 'Bạn chọn option trong dropdown native như thế nào?', model: 'I wrap the select element with the Select class and use selectByVisibleText, selectByValue or selectByIndex.', viExp: 'Select dùng cho thẻ select native.', kw: ['Select', 'native', 'selectByVisibleText', 'selectByValue'], follow: 'How would you handle a dropdown built with div and li elements?', mistake: 'Dùng Select cho dropdown tự vẽ.' },
{ id: 'A12', lesson: 12, cat: 'Ứng dụng', en: 'How do you handle a JavaScript confirm dialog?', vi: 'Bạn xử lý hộp thoại confirm JavaScript thế nào?', model: 'I switch to the alert with switchTo().alert(), read its text, and call accept() for OK or dismiss() for Cancel.', viExp: 'Chuyển sang alert, đọc, rồi chọn OK hoặc Cancel.', kw: ['switchTo', 'alert', 'accept', 'dismiss'], follow: 'What exception occurs if no alert is present?', mistake: 'Dùng accept khi kịch bản cần Cancel.' },
{ id: 'A13', lesson: 13, cat: 'Xử lý lỗi', en: 'Why might findElement fail for an element that I can see on the screen?', vi: 'Vì sao findElement có thể lỗi dù bạn thấy phần tử trên màn hình?', model: 'The element may be inside an iframe. Selenium only searches the current context, so I must switch into the frame first.', viExp: 'Nhìn thấy không có nghĩa là driver ở đúng ngữ cảnh.', kw: ['iframe', 'context', 'switchTo', 'frame'], follow: 'How do you return to the main page after working in a frame?', mistake: 'Nói Selenium tự tìm trong mọi iframe.' },
{ id: 'A14', lesson: 14, cat: 'Ứng dụng', en: 'How do you switch to a new tab opened by a link?', vi: 'Bạn chuyển sang tab mới do link mở ra thế nào?', model: 'I save the original window handle, click the link, wait until there are two handles, then switch to the handle that is not the original.', viExp: 'Lưu handle gốc, chờ tab mới, rồi chuyển đúng handle.', kw: ['window handle', 'getWindowHandles', 'switchTo().window', 'wait'], follow: 'Can you assume the second handle is the new tab?', mistake: 'Giả định thứ tự handle và không chờ tab mới mở.' },
{ id: 'A15', lesson: 15, cat: 'Ứng dụng', en: 'When would you use the Actions class?', vi: 'Khi nào bạn dùng lớp Actions?', model: 'I use Actions for hover, drag-and-drop, and keyboard combinations that need several steps. I must call perform() to run the chain.', viExp: 'Actions cho chuỗi thao tác chuột và phím; nhớ perform().', kw: ['hover', 'drag', 'keyboard', 'perform'], follow: 'How do you press Ctrl+A using Actions?', mistake: 'Quên perform() và nghĩ thao tác đã chạy.' },
{ id: 'A16', lesson: 16, cat: 'Xử lý lỗi', en: 'What is the difference between StaleElementReferenceException and NoSuchElementException?', vi: 'Khác nhau giữa StaleElementReferenceException và NoSuchElementException là gì?', model: 'NoSuchElementException means the locator matches nothing. Stale means I hold a reference to an element that is no longer attached to the DOM, so I must find it again.', viExp: 'Không tìm thấy vs tham chiếu đã cũ.', kw: ['no match', 'stale', 'no longer attached', 'find again'], follow: 'Why would a page re-render and cause stale references?', mistake: 'Dùng sleep để "sửa" stale thay vì tìm lại phần tử.' },
{ id: 'A17', lesson: 17, cat: 'So sánh', en: 'What is the difference between @BeforeClass and @BeforeMethod?', vi: 'Khác nhau giữa @BeforeClass và @BeforeMethod là gì?', model: 'BeforeClass runs once before the tests in a class. BeforeMethod runs before every test method.', viExp: 'Một lần cho class; mỗi test một lần.', kw: ['once', 'class', 'every test method'], follow: 'Where would you open the browser: BeforeClass or BeforeMethod? Why?', mistake: 'Mở browser trong BeforeMethod mà không đóng đúng cách.' },
{ id: 'A18', lesson: 18, cat: 'So sánh', en: 'What is the difference between hard assert and soft assert?', vi: 'Khác nhau giữa hard assert và soft assert là gì?', model: 'A hard assert stops the test at the first failure. A soft assert records failures and continues, and assertAll() reports them.', viExp: 'Hard dừng; soft gom lỗi và cần assertAll().', kw: ['hard', 'stops', 'soft', 'assertAll'], follow: 'What happens if you forget assertAll()?', mistake: 'Quên assertAll() nên lỗi bị bỏ qua.' },
{ id: 'A19', lesson: 19, cat: 'Định nghĩa', en: 'What is the Page Object Model and is it a framework?', vi: 'Page Object Model là gì và nó có phải framework không?', model: 'POM is a design pattern where each page has a class with its locators and actions. It is not a framework; TestNG or JUnit are frameworks.', viExp: 'POM là mẫu thiết kế, không phải thư viện hay framework.', kw: ['design pattern', 'page class', 'locators', 'not a framework'], follow: 'What is the difference between POM and PageFactory?', mistake: 'Nói POM là một framework kiểm thử.' },
{ id: 'A20', lesson: 20, cat: 'Ứng dụng', en: 'How would you test login with several accounts without copying the test?', vi: 'Bạn kiểm thử đăng nhập với nhiều tài khoản mà không copy test thế nào?', model: 'I use a TestNG DataProvider that returns a row per account, and a single @Test that receives each row as parameters, including negative cases.', viExp: 'DataProvider cung cấp dữ liệu; một test chạy nhiều lần.', kw: ['DataProvider', 'row', 'parameters', 'negative'], follow: 'How do you verify that invalid credentials are rejected?', mistake: 'Chỉ có dữ liệu đúng, không có dữ liệu sai.' },
{ id: 'A21', lesson: 3, cat: 'Xử lý lỗi', en: 'The test fails with NoSuchElementException after a build, but the page looks fine. What do you check first?', vi: 'Sau một lần build, test lỗi NoSuchElementException nhưng trang trông bình thường. Bạn kiểm tra gì trước?', model: 'I check whether the locator still matches: the id may have changed, or the element may be inside a frame. I compare the locator with the current DOM.', viExp: 'Kiểm tra locator với DOM thật, rồi kiểm tra ngữ cảnh frame.', kw: ['locator', 'DOM', 'frame', 'changed'], follow: 'How would you make the locator more stable?', mistake: 'Tăng timeout mà không kiểm tra locator.' },
{ id: 'A22', lesson: 4, cat: 'Ứng dụng', en: 'How would you locate the quantity input in the row for "T-shirt"?', vi: 'Bạn tìm ô số lượng trong hàng "Áo thun" thế nào?', model: 'I find the row that contains the text "T-shirt" using an XPath with ancestor or descendant axes, then select the quantity input inside it.', viExp: 'Dùng quan hệ cha/con để thu hẹp đúng hàng.', kw: ['ancestor', 'descendant', 'row', 'text'], follow: 'What if two rows contain the same text?', mistake: 'Tìm input đầu tiên trên trang mà không ràng buộc hàng.' },
{ id: 'A23', lesson: 6, cat: 'Ứng dụng', en: 'How would you count the number of products on a page?', vi: 'Bạn đếm số sản phẩm trên trang thế nào?', model: 'I use findElements with a locator that matches each product card, then call size() on the returned list.', viExp: 'findElements trả về list; size() để đếm.', kw: ['findElements', 'List', 'size'], follow: 'What happens when no products are found?', mistake: 'Dùng findElement để đếm.' },
{ id: 'A24', lesson: 8, cat: 'So sánh', en: 'Why is mixing implicit and explicit waits risky?', vi: 'Vì sao trộn implicit và explicit wait là rủi ro?', model: 'Mixing them can produce unpredictable total wait times. The Selenium documentation advises not to mix them.', viExp: 'Thời gian tổng khó đoán; nên chọn một cách và dùng explicit cho điều kiện.', kw: ['unpredictable', 'do not mix', 'total wait'], follow: 'Which wait would you use for a button that becomes enabled after an AJAX call?', mistake: 'Nói trộn hai cách giúp test nhanh hơn.' },
{ id: 'A25', lesson: 9, cat: 'So sánh', en: 'Explain presence, visibility and clickability.', vi: 'Giải thích presence, visibility và clickability.', model: 'Presence means the element exists in the DOM. Visibility means it is displayed. Clickable means it is visible and enabled, though another element could still cover it.', viExp: 'Ba mức điều kiện khác nhau; không đồng nhất.', kw: ['DOM', 'displayed', 'enabled', 'covered'], follow: 'Which condition would you use for an overlay that blocks the click?', mistake: 'Nghĩ clickable đảm bảo không có lớp phủ.' },
{ id: 'A26', lesson: 13, cat: 'Ứng dụng', en: 'How do you switch into a nested iframe and return to the main page?', vi: 'Bạn vào iframe lồng nhau và quay về trang chính thế nào?', model: 'I switch to the outer frame, then the inner frame. To go up one level I use parentFrame(), and to return to the main document I use defaultContent().', viExp: 'Đi từng cấp; parentFrame lên một cấp; defaultContent về gốc.', kw: ['outer', 'inner', 'parentFrame', 'defaultContent'], follow: 'What is the difference between parentFrame and defaultContent?', mistake: 'Quên quay về main và thao tác phần tử sai ngữ cảnh.' },
{ id: 'A27', lesson: 16, cat: 'Xử lý lỗi', en: 'Your click fails with ElementClickInterceptedException. What do you do?', vi: 'Click của bạn lỗi ElementClickInterceptedException. Bạn xử lý thế nào?', model: 'I identify the element covering the target, then wait for it to disappear or close it. I avoid simply adding sleep or using a JavaScript click that hides the real problem.', viExp: 'Xử lý nguyên nhân là lớp phủ; không che lỗi.', kw: ['covering', 'wait', 'overlay', 'close'], follow: 'When is a JavaScript click acceptable?', mistake: 'Dùng JavaScript click ngay để tránh lỗi.' },
{ id: 'A28', lesson: 17, cat: 'Xử lý lỗi', en: 'A test fails in the middle. How do you make sure the browser still closes?', vi: 'Test fail giữa chừng. Làm sao đảm bảo browser vẫn được đóng?', model: 'I call quit() in an @AfterClass method or a finally block. TestNG runs the after methods even when a test fails.', viExp: 'Dọn dẹp đặt ở khối luôn chạy, không đặt cuối test thường.', kw: ['AfterClass', 'quit', 'finally', 'fails'], follow: 'How would you capture a screenshot for a failed test?', mistake: 'Đặt quit() ở cuối test thường, nên khi fail thì không chạy.' },
{ id: 'A29', lesson: 18, cat: 'Ứng dụng', en: 'When would you use a soft assert instead of a hard assert?', vi: 'Khi nào bạn dùng soft assert thay vì hard assert?', model: 'I use a soft assert to check several independent details on one page, so I can see all failures in one run. For preconditions, such as being logged in, I use a hard assert.', viExp: 'Soft cho kiểm tra độc lập; hard cho điều kiện tiên quyết.', kw: ['independent', 'several', 'precondition', 'hard'], follow: 'What happens if a soft assert fails and you never call assertAll()?', mistake: 'Dùng soft assert cho điều kiện tiên quyết khiến các bước sau chạy vô nghĩa.' },
{ id: 'A30', lesson: 20, cat: 'Định nghĩa', en: 'What is data-driven testing?', vi: 'Kiểm thử điều khiển bằng dữ liệu là gì?', model: 'Data-driven testing runs the same test logic with multiple sets of input data, so each data set is tested independently.', viExp: 'Logic cố định, dữ liệu thay đổi; mỗi bộ dữ liệu là một lần chạy.', kw: ['same logic', 'multiple data sets', 'independent'], follow: 'How does TestNG pass each data row to a test method?', mistake: 'Nghĩ data-driven là copy test cho mỗi dữ liệu.' }

/* ===== ENGINE CORE (pure, deterministic, no DOM) ===== */
function sbvabClone(o) { return JSON.parse(JSON.stringify(o)); }

/* Build every immutable snapshot up front. snaps[i] is the FULL state after i steps.
   Undo / Timeline / Reset simply select a stored snapshot, so restoration is exact. */
function sbvabBuildSnapshots(sim) {
  var snaps = [];
  var s0 = sbvabClone(sim.init);
  s0.step = 0; s0.time = 0; s0.line = -1; s0.st = 'idle'; s0.exc = null;
  s0.stepTitle = 'Trạng thái ban đầu'; s0.cmd = ''; s0.logs = []; s0.info = null;
  snaps.push(s0);
  sim.steps.forEach(function (stp, i) {
    var prev = snaps[i];
    var n = sbvabClone(prev);
    n.step = i + 1;
    n.time = +(prev.time + (stp.dt || 1)).toFixed(1);
    n.line = stp.line;
    n.st = stp.st || 'run';
    n.stepTitle = stp.t;
    n.cmd = stp.line >= 0 ? sim.code[stp.line] : '';
    n.exc = null;
    n.info = { what: stp.what, why: stp.why, how: stp.how, impact: stp.impact };
    n.logs = prev.logs.concat([{ time: n.time, msg: stp.t, st: n.st }]);
    if (stp.fx) stp.fx(n);
    snaps.push(n);
  });
  return snaps;
}

/* Flatten a state into path -> value, ignoring bookkeeping keys. */
var SBVAB_META = ['step', 'time', 'line', 'st', 'stepTitle', 'cmd', 'logs', 'info', 'exc'];
function sbvabFlatten(obj, prefix, out) {
  if (obj === null || typeof obj !== 'object') { out[prefix] = obj; return out; }
  Object.keys(obj).forEach(function (k) {
    if (!prefix && SBVAB_META.indexOf(k) >= 0) return;
    sbvabFlatten(obj[k], prefix ? prefix + '.' + k : k, out);
  });
  return out;
}

/* STATE CHANGE: list of differences between two snapshots. */
function sbvabDiff(prev, cur) {
  var a = sbvabFlatten(prev, '', {}), b = sbvabFlatten(cur, '', {});
  var keys = Object.keys(a).concat(Object.keys(b).filter(function (k) { return !(k in a); }));
  var out = [];
  keys.forEach(function (k) {
    var x = a[k], y = b[k];
    if (JSON.stringify(x) !== JSON.stringify(y)) out.push({ path: k, from: x, to: y });
  });
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sbvabClone: sbvabClone, sbvabBuildSnapshots: sbvabBuildSnapshots, sbvabDiff: sbvabDiff };
}

  var P = loadP();

  P.quizSessions = P.quizSessions || [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function lessonById(id) { return LESSONS.filter(function (l) { return l.id === +id; })[0]; }
  function simsOf(id) { return SIMS.filter(function (s) { return s.lesson === +id; }); }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }

  /* ---------- sidebar ---------- */
  function buildNav(route) {
    var items = [
      ['#/', 'Dashboard', '⌂'], ['#/day/1', 'Day 1', '1'], ['#/day/2', 'Day 2', '2'], ['#/day/3', 'Day 3', '3'], ['#/day/4', 'Day 4', '4'],
      ['#/flash', 'Flashcards', '▤'], ['#/quiz', 'Quiz', '?'], ['#/audit', 'Mock Audit', '🎙'], ['#/cheat', 'Cheat Sheet', '⇄'],
      ['#/glossary', 'Glossary', 'A'], ['#/weak', 'Weak Points', '!'], ['#/refs', 'References', '§'], ['#/extra', 'Kiến thức bổ sung', '+'], ['#/data', 'Dữ liệu & Cài đặt', '⚙']
    ];

  function navLink(it, route) {

  }

  /* ---------- simulation engine UI ---------- */
  var CTL = {};
  function getCtl(sim) {
    if (!CTL[sim.id]) CTL[sim.id] = { sim: sim, snaps: sbvabBuildSnapshots(sim), idx: 0, speed: 1, playing: false, timer: null, pred: null };
    return CTL[sim.id];
  }
  function stopTimer(c) { if (c.timer) { clearTimeout(c.timer); c.timer = null; } c.playing = false; }
  function stopAll() { Object.keys(CTL).forEach(function (k) { stopTimer(CTL[k]); }); }
  function scheduleTick(c) {
    c.timer = setTimeout(function () {
      c.timer = null;
      if (!c.playing) return;
      var last = c.snaps.length - 1;
      if (c.idx < last) c.idx++;
      if (c.idx >= last) { c.playing = false; P.sims[c.sim.id] = true; saveP(); }
      render(c);
      if (c.playing) scheduleTick(c);
    }, 1200 / c.speed);
  }
  function act(c, a, arg) {
    var last = c.snaps.length - 1;
    if (a === 'play') { stopAll(); if (c.idx < last) { c.playing = true; scheduleTick(c); } }
    else if (a === 'pause') { stopTimer(c); }
    else if (a === 'next') { stopAll(); if (c.idx < last) c.idx++; }
    else if (a === 'prev') { stopAll(); if (c.idx > 0) c.idx--; }
    else if (a === 'reset') { stopAll(); c.idx = 0; }
    else if (a === 'replay') { stopAll(); c.idx = 0; c.playing = true; scheduleTick(c); }
    else if (a === 'goto') { stopAll(); c.idx = Math.max(0, Math.min(last, arg)); }
    else if (a === 'speed') { var was = c.playing; stopAll(); c.speed = arg; if (was && c.idx < last) { c.playing = true; scheduleTick(c); } }
    else if (a === 'pred') { c.pred = arg; }
    if (c.idx === last && a !== 'pred') { P.sims[c.sim.id] = true; saveP(); }
    render(c);
  }
  function stPill(st) {
    var map = { idle: ['gray', '○ Chưa chạy'], run: ['blue', '▶ Đang thực thi'], ok: ['green', '✓ Thành công'], err: ['red', '✗ Lỗi / Exception'], wait: ['yellow', '⏳ Đang chờ'] };
    var m = map[st] || map.idle;
    return '<span class="pill ' + m[0] + '">' + m[1] + '</span>';
  }
  function elHTML(e) {
    var c = 'el ' + (e.c || '');
    return '<div class="' + c.trim() + '"><span class="tg">' + esc(e.tag) + '</span><span>' + esc(e.label) + '</span>' +
      (e.hint ? '<span class="hint">' + esc(e.hint) + '</span>' : '') + '</div>';
  }
  function leftHTML(s) {
    var h = '';
    if (s.clock) {
      var fill = Math.min(100, 100 * s.clock.now / s.clock.max), lim = 100 * s.clock.limit / s.clock.max;
      h += '<div class="clock" aria-label="Đồng hồ mô phỏng"><div class="row"><span class="pill yellow">⏱ ' + esc(s.clock.label) + '</span><span class="muted">Đã trôi: ' + s.clock.now + 's / giới hạn: ' + s.clock.limit + 's</span></div>' +
        '<div class="track"><div class="fill" style="width:' + fill + '%"></div><div class="limit" style="left:' + lim + '%" title="Timeout"></div></div></div>';
    }
    if (s.nodes) {
      h += '<div class="nodes">' + s.nodes.map(function (n, i) {
        return (i ? '<span class="arrow" aria-hidden="true">' + (n.arrow || '→') + '</span>' : '') +
          '<div class="node ' + (n.st || '') + '"><b>' + esc(n.label) + '</b><small>' + esc(n.sub || '') + '</small></div>';
      }).join('') + '</div>';
    }
    if (s.browser) {
      var b = s.browser;
      h += '<div class="browser" role="img" aria-label="Trình duyệt mô phỏng">';
      h += '<div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="url">' + esc(b.url) + '</span><span class="muted">' + esc(b.title || '') + '</span></div>';
      if (b.tabs) h += '<div class="tabstrip">' + b.tabs.map(function (t) { return '<span class="tab' + (t.active ? ' active' : '') + '">' + (t.active ? '● ' : '') + esc(t.title) + '</span>'; }).join('') + '</div>';
      h += '<div class="page">' + (s.dom || []).map(elHTML).join('') + '</div>';
      if (b.ctx && b.ctx !== 'main') h += '<div class="ctx">Ngữ cảnh hiện tại: ' + esc(b.ctx) + ' (driver đang ở trong frame này)</div>';
      else h += '<div class="ctx" style="background:var(--panel2);color:var(--muted)">Ngữ cảnh hiện tại: main document</div>';

    } else if (s.dom) {

    }
    if (s.vars && Object.keys(s.vars).length) {

    }
    if (s.exc) h += '<div class="exc" role="alert"><b>⚠ Exception:</b> ' + esc(s.exc) + '</div>';
    return h;
  }
  function rightHTML(c) {
    var s = c.snaps[c.idx], sim = c.sim, last = c.snaps.length - 1, h = '';
    h += '<h3 style="margin-top:0">Mã Java minh họa</h3><div class="codepanel" role="region" aria-label="Mã Java">';
    sim.code.forEach(function (ln, i) {
      h += '<div class="' + (i === s.line ? 'cur' : '') + '"><span class="n">' + (i + 1) + '</span><span>' + esc(ln) + '</span></div>';

  function buildFC() {

    return '<h1>Glossary — Từ điển thuật ngữ</h1><div class="card"><input type="text" id="gsearch" data-gsearch placeholder="Tìm thuật ngữ (ví dụ: wait, locator)" value="' + esc(q) + '" aria-label="Tìm thuật ngữ"></div>' +
      '<table><tr><th>Thuật ngữ (EN)</th><th>Giải thích (VI)</th><th>Bài</th></tr>' + items.map(function (g) {
        return '<tr><td><b>' + esc(g[0]) + '</b></td><td>' + esc(g[1]) + '</td><td><a href="#/lesson/' + g[2] + '">' + g[2] + '</a></td></tr>';
      }).join('') + '</table><p class="muted">' + items.length + ' thuật ngữ.</p>';
  }
  function refsView() {
    return '<h1>References — Tài liệu chính thức</h1><p class="muted">Các liên kết được kiểm tra HTTP 200 vào ' + esc(REF_VERIFIED) + '. Nội dung mô tả tóm tắt theo tài liệu; không sao chép nguyên văn.</p>' +
      LESSONS.map(function (l) { return '<section class="card"><h3 style="margin-top:0">Bài ' + l.id + ': ' + esc(l.title) + '</h3>' + refsHTML(l.refs) + '</section>'; }).join('');
  }
  function weakView() {
    var w = weakTopics();
    var sim = P.audit.length, quizTotal = Object.keys(P.quiz).filter(function (k) { return P.quiz[k].n > 0; }).length;
    return '<h1>Weak Points — Chủ đề yếu & khoảng trống</h1><p class="muted">Dựa trên: câu quiz đã sai, thẻ "Chưa nhớ/Chưa chắc", và tự đánh giá Mock Audit. Không có dữ liệu thì không có điểm yếu được tính.</p>' +
      '<div class="card">' + (w.length ? '<table><tr><th>Bài</th><th>Điểm yếu</th><th>Lý do</th></tr>' + w.map(function (x) { return '<tr><td><a href="#/lesson/' + x.id + '">' + x.id + '. ' + esc(x.title) + '</a></td><td>' + x.v + '</td><td>' + x.reason + '</td></tr>'; }).join('') + '</table>' : '<p>Chưa có dữ liệu. Đã làm ' + quizTotal + ' câu quiz và ' + sim + ' lượt tự đánh giá Mock Audit.</p>') + '</div>' +
      '<div class="card"><h3 style="margin-top:0">Hành động gợi ý</h3><ol><li>Mở các bài có điểm cao nhất, xem lại mô phỏng và Lỗi thường gặp.</li><li>Làm <a href="#/quiz">Quiz → Ôn câu đã sai</a>.</li><li>Ôn <a href="#/flash">flashcard chế độ "Thẻ đã sai / khó"</a>.</li></ol></div>';
  }
  function dataView() {
    return '<h1>Dữ liệu tiến độ & cài đặt</h1>' +
      '<div class="card"><h3 style="margin-top:0">Giao diện</h3><div class="row"><span>Chế độ màu:</span><button data-theme="auto">Theo hệ thống</button><button data-theme="light">Sáng</button><button data-theme="dark">Tối</button></div></div>' +
      '<div class="card"><h3 style="margin-top:0">Xuất / nhập tiến độ (JSON)</h3><p class="muted">Tiến độ được lưu trong trình duyệt này. Xuất ra file JSON để sao lưu hoặc chuyển sang máy khác.</p>' +
      '<div class="row"><button class="primary" data-data="export">Xuất JSON</button><button data-data="import">Nhập JSON từ ô bên dưới</button></div>' +
      '<textarea id="jsonbox" aria-label="Nội dung JSON" placeholder="Dán nội dung JSON đã xuất vào đây để nhập"></textarea><p id="jsonmsg" class="muted"></p></div>' +
      '<div class="card"><h3 style="margin-top:0">Đặt lại tiến độ</h3><p class="muted">Thao tác này xóa mọi tiến độ, thẻ, quiz và lịch sử audit trên trình duyệt này.</p><button data-data="reset" style="border-color:var(--red);color:var(--red)">Đặt lại tất cả tiến độ…</button></div>';
  }

  function extraView() {
    return '<h1>Kiến thức bổ sung</h1><p class="muted">Giới thiệu ngắn các chủ đề thường được hỏi nhưng không nằm trong 20 bài chính. Mục tiêu: hiểu khái niệm và công dụng; không cần thuộc cú pháp.</p>' +
      EXTRA_TOPICS.map(function (t) {
        return '<section class="card"><h2>' + esc(t.title) + '</h2><p><b>Là gì / làm gì:</b> ' + esc(t.what) + '</p><p><b>Vì sao cần:</b> ' + esc(t.why) + '</p><p><b>Cách làm:</b> ' + esc(t.how) + '</p>' +
          '<div class="codebox"><pre style="margin:0">' + t.code.map(esc).join('\n') + '</pre></div><p class="muted">' + esc(t.note) + '</p>' + refsHTML(t.refs) + '</section>';
      }).join('');
  }

  /* ---------- router ---------- */
  var ROUTE = '';
  function parse() {
    var h = location.hash || '#/';
    var m;
    if ((m = h.match(/^#\/lesson\/(\d+)/))) return { r: '#/lesson', id: +m[1] };
    if ((m = h.match(/^#\/day\/(\d)/))) return { r: '#/day', id: +m[1] };
    return { r: h.split('?')[0] || '#/' };
  }
  function render_page() {
    var rt = parse(), main = $('#main');
    stopAll();
    stopAuditTimer();
    var route = rt.r === '#/lesson' ? '#/lesson/' + rt.id : rt.r === '#/day' ? '#/day/' + rt.id : rt.r;
    buildNav(route === '#/lesson/' + rt.id ? '#/day/' + DAY_OF[rt.id] : route);
    var html = '';
    if (rt.r === '#/lesson') { html = lessonView(rt.id); main.innerHTML = html; mountSims(rt.id); }
    else if (rt.r === '#/day') main.innerHTML = dayView(rt.id);
    else if (rt.r === '#/flash') main.innerHTML = fcView();
    else if (rt.r === '#/quiz') main.innerHTML = quizView();
    else if (rt.r === '#/audit') main.innerHTML = auditView();
    else if (rt.r === '#/cheat') main.innerHTML = cheatView();
    else if (rt.r === '#/glossary') main.innerHTML = glossaryView('');
    else if (rt.r === '#/weak') main.innerHTML = weakView();
    else if (rt.r === '#/refs') main.innerHTML = refsView();
    else if (rt.r === '#/extra') main.innerHTML = extraView();
    else if (rt.r === '#/data') main.innerHTML = dataView();
    else main.innerHTML = dashboard();
    if (rt.r === '#/flash') { /* keep */ }
    $('#side').classList.remove('open');
    document.title = (rt.r === '#/lesson' ? lessonById(rt.id).title : 'Selenium Java Visual Audit Bootcamp');
    ROUTE = rt.r;
    try { main.focus({ preventScroll: true }); } catch (e) { }
  }
  window.addEventListener('hashchange', function () { FC.list = []; render_page(); window.scrollTo(0, 0); });

  /* ---------- delegated events ---------- */
  function onClick(e) {
    var t = e.target.closest('button, [data-lesson-done], [data-bm], [data-fc], [data-fca], [data-qz], [data-au], [data-data], [data-theme], [data-sim]');
    if (e.target.closest('[data-fc="flip"]') && !e.target.closest('button')) { FC.flipped = !FC.flipped; return render_page(); }
    if (!t) return;
    var sim = t.getAttribute('data-sim');
    if (sim && t.hasAttribute('data-act')) {
      var c = CTL[sim]; if (!c) return;
      var a = t.getAttribute('data-act');
      if (a === 'goto') return act(c, 'goto', +t.getAttribute('data-i'));
      if (a === 'pred') return;
      return act(c, a);
    }
    if (t.hasAttribute('data-lesson-done')) { var id = t.getAttribute('data-lesson-done'); P.lessons[id] = !P.lessons[id]; saveP(); return render_page(); }
    if (t.hasAttribute('data-bm')) { var b = +t.getAttribute('data-bm'); P.bm = P.bm.indexOf(b) >= 0 ? P.bm.filter(function (x) { return x !== b; }) : P.bm.concat([b]); saveP(); return render_page(); }
    var fca = t.getAttribute('data-fca');
    if (fca) {
      if (FC.list.length === 0 && fca !== 'apply') buildFC();
      var card = FC.list[FC.i];
      if (fca === 'apply') { buildFC(); }
      else if (fca === 'shuffle') { shuffleFC(); }
      else if (fca === 'prev') { FC.i = Math.max(0, FC.i - 1); FC.flipped = false; }
      else if (fca === 'next') { FC.i = Math.min(FC.list.length - 1, FC.i + 1); FC.flipped = false; }
      else if (fca === 'flip') { FC.flipped = !FC.flipped; }
      else if (fca === 'bm' && card) { var s0 = cardState(card); P.flash[card.id] = Object.assign({}, s0, { bm: !s0.bm, r: s0.r === undefined ? 'new' : s0.r }); saveP(); }
      else if (fca === 'rate' && card) { rateCard(card, t.getAttribute('data-r')); FC.i = Math.min(FC.list.length - 1, FC.i + 1); FC.flipped = false; }
      return render_page();
    }
    var qz = t.getAttribute('data-qz');
    if (qz === 'submit' || qz === 'retry' || qz === 'retake' || qz === 'start') {
      if (qz === 'start') { var m = $('[data-qz="mode"]').value, ar = $('[data-qz="arg"]').value; pickQuiz(m, ar); }
      else if (qz === 'retake') { pickQuiz(QZ.mode, QZ.arg); }
      else if (qz === 'retry') { pickQuiz('wrong', ''); }
      else if (qz === 'submit') {
        QZ.submitted = true;
        var sc = 0;
        QZ.set.forEach(function (q) {
          var sel = QZ.answers[q.id], ok = sel === q.ans; if (ok) sc++;
          var rec = P.quiz[q.id] || { n: 0, c: false };
          P.quiz[q.id] = { n: rec.n + 1, c: ok, last: Date.now() };
        });
        P.quizSessions.push({ t: Date.now(), n: QZ.set.length, score: sc }); saveP();
      }
      return render_page();
    }
    var au = t.getAttribute('data-au');
    if (au) {
      if (au === 'start') { auditStart(); }
      else if (au === 'check') { render_page(); }
      else if (au === 'reveal') { AU.revealed = !AU.revealed; }
      else if (au === 'self') { AU.self = +t.getAttribute('data-s'); var q0 = AU.list[AU.i]; P.audit.push({ t: Date.now(), id: q0.id, lesson: q0.lesson, self: AU.self }); saveP(); }
      else if (au === 'next') { AU.i++; AU.revealed = false; AU.typed = ''; AU.self = null; startAuditTimer(); if (AU.i >= AU.list.length) P.auditSessions = (P.auditSessions || 0) + 1; saveP(); }
      else if (au === 'stop') { AU.i = AU.list.length; stopAuditTimer(); }
      else if (au === 'restart') { AU.started = false; }
      return render_page();
    }
    var dt = t.getAttribute('data-data');
    if (dt) return dataAction(dt);
    var th = t.getAttribute('data-theme');
    if (th) { try { if (th === 'auto') localStorage.removeItem('sbvab-theme'); else localStorage.setItem('sbvab-theme', th); } catch (x) { } applyTheme(); }
  }
  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var o = JSON.parse(reader.result);
        if (!o || o.sbvab !== 1 || typeof o.progress !== 'object') throw new Error('File không đúng định dạng tiến độ của ứng dụng này.');
        if (!window.confirm('Thay tiến độ hiện tại trên máy này bằng nội dung file "' + file.name + '"?')) return;
        P = o.progress; P.lessons = P.lessons || {}; P.sims = P.sims || {}; P.flash = P.flash || {}; P.quiz = P.quiz || {}; P.audit = P.audit || []; P.bm = P.bm || []; P.check = P.check || {};
        saveP(); FC.list = []; render_page();
        var msg = $('#syncmsg'); if (msg) msg.textContent = 'Đã nhập tiến độ từ file.';
      } catch (x) { window.alert('Không nhập được: ' + x.message); }
    };
    reader.onerror = function () { window.alert('Không đọc được file.'); };
    reader.readAsText(file);
  }
  function applyTheme() {
    var th = null; try { th = localStorage.getItem('sbvab-theme'); } catch (x) { }
    if (th) document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  }
  function dataAction(dt) {
    var msg = $('#jsonmsg');
    if (dt === 'export') {
      var blob = JSON.stringify({ sbvab: 1, exportedAt: new Date().toISOString(), progress: P }, null, 2);
      var box = $('#jsonbox'); if (box) box.value = blob;
      try { var a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(blob); a.download = 'sbvab-progress.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (x) { }
      if (msg) msg.textContent = 'Đã tạo JSON (nằm trong ô bên dưới). Nếu chưa tải file, hãy sao chép nội dung trong ô.';
    } else if (dt === 'import') {
      try {
        var o = JSON.parse($('#jsonbox').value);
        if (!o || o.sbvab !== 1 || typeof o.progress !== 'object') throw new Error('Định dạng không đúng (cần {sbvab:1, progress:{...}}).');
        P = o.progress; P.lessons = P.lessons || {}; P.sims = P.sims || {}; P.flash = P.flash || {}; P.quiz = P.quiz || {}; P.audit = P.audit || []; P.bm = P.bm || []; P.check = P.check || {};
        saveP(); FC.list = []; if (msg) msg.textContent = 'Đã nhập tiến độ thành công.'; render_page();
      } catch (x) { if (msg) msg.textContent = 'Lỗi nhập: ' + x.message; }
    } else if (dt === 'download') {
      var d = new Date(), pad = function (n) { return ('0' + n).slice(-2); };
      var fname = 'sbvab-tien-do-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
      P.lastExport = Date.now(); saveP();
      var text = JSON.stringify({ sbvab: 1, exportedAt: new Date().toISOString(), progress: P }, null, 2);
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a'); a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (x) { }
      var sm = $('#syncmsg'); if (sm) sm.textContent = 'Đã tải ' + fname + '. Hãy giữ file này (Drive, Zalo, email...).';
      else render_page();
    } else if (dt === 'pick') {
      var fi = $('#importfile'); if (fi) fi.click();
    } else if (dt === 'reset') {
      if (window.confirm('Xóa toàn bộ tiến độ trên trình duyệt này? Thao tác không thể hoàn tác.')) {
        if (window.prompt('Gõ RESET (chữ hoa) để xác nhận:') === 'RESET') {
          P = { lessons: {}, sims: {}, flash: {}, quiz: {}, audit: [], bm: [], check: {}, last: null, quizSessions: [] };
          saveP(); FC.list = []; render_page();
        }
      }
    }
  }
  document.addEventListener('click', onClick);
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('select[data-act="speed"]')) { var c = CTL[t.getAttribute('data-sim')]; if (c) act(c, 'speed', +t.value); return; }
    if (t.matches('input[data-act="pred"]')) { var c2 = CTL[t.getAttribute('data-sim')]; if (c2) { c2.pred = +t.getAttribute('data-i'); } return; }
    if (t.matches('[data-fcf]')) { FC.filter[t.getAttribute('data-fcf')] = t.value; FC.list = []; return render_page(); }
    if (t.matches('[data-qz="pick"]')) { QZ.answers[t.getAttribute('data-q')] = +t.value; return; }
    if (t.id === 'importfile') { handleImportFile(t.files && t.files[0]); t.value = ''; return; }
    if (t.matches('[data-check]')) { P.check[t.getAttribute('data-check')] = t.checked; saveP(); return; }
    if (t.matches('[data-au="mode"]')) return;
    if (t.matches('[data-qz="mode"]')) { var sel = $('[data-qz="arg"]'); var opts = t.value === 'day' ? [1, 2, 3, 4] : LESSONS.map(function (l) { return l.id; }); sel.innerHTML = opts.map(function (v) { return '<option value="' + v + '">' + (t.value === 'day' ? 'Ngày ' + v : 'Bài ' + v + ': ' + lessonById(v).title) + '</option>'; }).join(''); return; }
    if (t.matches('[data-au="count"]')) { AU.sessionCount = +t.value; return render_page(); }
    if (t.matches('[data-au="cat"]')) { AU.cat = t.value; return render_page(); }
    if (t.matches('[data-au="lesson"]')) { AU.lesson = t.value; return render_page(); }
    if (t.matches('[data-au="timer"]')) { AU.timerOn = t.checked; return render_page(); }
    if (t.matches('[data-au="mins"]')) { AU.mins = +t.value; return render_page(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('[data-au="typed"]')) { AU.typed = t.value; return; }
    if (t.matches('[data-gsearch]')) { var pos = t.selectionStart; $('#main').innerHTML = glossaryView(t.value); var n = $('#gsearch'); n.focus(); n.setSelectionRange(pos, pos); }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.matches && t.matches('[data-fc="flip"]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); FC.flipped = !FC.flipped; render_page(); }
  });
  var menu = document.getElementById('menu');
  if (menu) menu.addEventListener('click', function () { $('#side').classList.toggle('open'); });

  applyTheme();
  if (!location.hash) { try { history.replaceState(null, '', '#/'); } catch (x) { } }
  render_page();
})();

</script>
</body>
</html>
